<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#071a3d"
  >

  <meta
    name="description"
    content="Rishi Music - offline personal music player"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Rishi Music"
  >

  <title>Rishi Music</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>

  <div class="app-shell">

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-icon">
          ♫
        </div>

        <div>
          <h1>RISHI MUSIC</h1>
          <p>Offline Music Station</p>
        </div>

      </div>


      <label class="import-button">

        <span>
          ＋ Import Songs
        </span>

        <input
          id="audioFileInput"
          type="file"
          accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.webm"
          multiple
        >

      </label>


      <button
        id="allModeBtn"
        class="side-button active"
      >
        ♫ All Songs
      </button>


      <div class="filter-title">
        MUSIC DIRECTOR
      </div>


      <select
        id="directorFilter"
        class="director-select"
      >

        <option value="All">
          All Directors
        </option>

      </select>


      <div class="library-info">

        <span id="songCount">
          0 songs
        </span>

        <span id="storageStatus">
          Offline storage
        </span>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <div>

          <p class="eyebrow">
            YOUR LIBRARY
          </p>

          <h2 id="viewTitle">
            All Songs
          </h2>

        </div>


        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="🔍 Search songs..."
        >

      </header>


      <div
        id="todayInfo"
        class="today-info"
      >
        Today's unplayed songs are prioritized in All mode.
      </div>


      <section
        id="songListContainer"
        class="song-list"
      ></section>

    </main>


    <section class="player">

      <div class="now-playing">

        <div class="mini-disc">
          ♫
        </div>

        <div class="now-text">

          <strong id="playerTitle">
            No track playing
          </strong>

          <span id="playerArtist">
            Choose a song from your library
          </span>

        </div>

      </div>


      <div class="player-controls">

        <button
          id="prevBtn"
          class="control"
          aria-label="Previous"
        >
          ⏮
        </button>

        <button
          id="playBtn"
          class="control play"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          class="control"
          aria-label="Next"
        >
          ⏭
        </button>

      </div>


      <div class="timeline">

        <span id="currentTime">
          0:00
        </span>

        <input
          id="progressBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <span id="totalTime">
          0:00
        </span>

      </div>

    </section>

  </div>


  <audio
    id="audioEngine"
    preload="auto"
    playsinline
  ></audio>


  <script src="./app.js"></script>


  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker.register("./sw.js", {
          scope: "./"
        })

        .then(function (registration) {

          console.log(
            "Rishi Music service worker registered:",
            registration.scope
          );

        })

        .catch(function (error) {

          console.error(
            "Rishi Music service worker registration failed:",
            error
          );

        });

      });

    }

  </script>

</body>

</html>
